        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap');

        }

<body>

    <div class="app-container">
        <!-- Title & Subtitle -->
        <h1>Style</h1>
        <p class="subtitle">A suitable filter for you, made special.</p>
        
        <!-- Canvas / Upload Area -->
        <div class="canvas-container" id="drop-zone" onclick="document.getElementById('file-input').click();">
            <div id="upload-prompt">
                <div class="dots-icon">• • •</div>
                <h2>Choose Your Canvas</h2>
                <p>Tap to select a photo<br>from your device</p>
            </div>
            <canvas id="image-canvas"></canvas>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <!-- Filter Strength Slider -->
        <div class="controls-section">
            <div class="hold-text">Hold to view original</div>
            <div class="slider-header">Filter Strength <span id="strength-val">100%</span></div>
            <input type="range" id="filter-slider" min="0" max="100" value="100">
        </div>

        <div class="presets-title">Curated Presets</div>

        <!-- Curated Preset Grid -->
        <div class="presets-grid">
            <button class="preset-btn active" data-preset="original">Original Raw</button>
            <button class="preset-btn" data-preset="vintage">90s Vintage Bloom</button>
            <button class="preset-btn" data-preset="digicam">2010s Digicam Flash</button>
            <button class="preset-btn" data-preset="cherry">Cherry Velvet Warmth</button>
            <button class="preset-btn" data-preset="noir">Archival Midnight Noir</button>
            <button class="preset-btn" data-preset="cinematic">Cinematic Teal & Amber</button>
            <button class="preset-btn" data-preset="ektar">Faded Ektar Film</button>
            <button class="preset-btn" data-preset="matte">Soft Editorial Matte</button>
            <button class="preset-btn" data-preset="grain">Heavy Analog Grain</button>
        </div>

        <!-- Bottom Action Buttons -->
        <div class="action-buttons">
            <button class="btn btn-secondary" id="change-btn" onclick="document.getElementById('file-input').click();">Change Photo</button>
            <button class="btn btn-primary" id="download-btn">Download Photo...</button>
        </div>
    </div>

    <!-- JavaScript Filter & Image Logic -->
    <script>
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('image-canvas');
        const ctx = canvas.getContext('2d');
        const uploadPrompt = document.getElementById('upload-prompt');
        const slider = document.getElementById('filter-slider');
        const strengthVal = document.getElementById('strength-val');
        const downloadBtn = document.getElementById('download-btn');
        const presetBtns = document.querySelectorAll('.preset-btn');

        let loadedImage = null;
        let activePreset = 'original';

        // Load photo onto canvas
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    loadedImage = img;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    uploadPrompt.style.display = 'none';
                    canvas.style.display = 'block';
                    applyFilters();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Handle preset switching
        presetBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                presetBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                activePreset = this.getAttribute('data-preset');
                applyFilters();
            });
        });

        // Handle slider changes
        slider.addEventListener('input', function() {
            strengthVal.textContent = `${this.value}%`;
            applyFilters();
        });

        // Filter rendering engine
        function applyFilters() {
            if (!loadedImage) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(loadedImage, 0, 0);

            const strength = parseFloat(slider.value) / 100;
            if (strength === 0 || activePreset === 'original') return;

            const filterCanvas = document.createElement('canvas');
            filterCanvas.width = canvas.width;
            filterCanvas.height = canvas.height;
            const fCtx = filterCanvas.getContext('2d');

            fCtx.drawImage(loadedImage, 0, 0);

            let filterString = '';
            switch (activePreset) {
                case 'vintage':
                    filterString = 'sepia(0.35) contrast(1.1) brightness(1.05) saturate(1.3) hue-rotate(-10deg)';
                    break;
                case 'digicam':
                    filterString = 'brightness(1.15) contrast(1.25) saturate(1.1)';
                    break;
                case 'cherry':
                    filterString = 'sepia(0.2) saturate(1.4) hue-rotate(-15deg) brightness(1.02)';
                    break;
                case 'noir':
                    filterString = 'grayscale(1) contrast(1.35) brightness(0.95)';
                    break;
                case 'cinematic':
                    filterString = 'contrast(1.15) saturate(1.2) hue-rotate(15deg)';
                    break;
                case 'ektar':
                    filterString = 'saturate(1.5) contrast(1.1) sepia(0.1)';
                    break;
                case 'matte':
                    filterString = 'contrast(0.9) brightness(1.08) saturate(0.85)';
                    break;
                case 'grain':
                    filterString = 'grayscale(0.5) contrast(1.2)';
                    break;
            }

            fCtx.filter = filterString;
            fCtx.drawImage(loadedImage, 0, 0);

            ctx.globalAlpha = strength;
            ctx.drawImage(filterCanvas, 0, 0);
            ctx.globalAlpha = 1.0;
        }

        // Image Download handler
        downloadBtn.addEventListener('click', function() {
            if (!loadedImage) {
                alert('Please upload a photo first!');
                return;
            }
            const link = document.createElement('a');
            link.download = 'style-filtered-photo.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
